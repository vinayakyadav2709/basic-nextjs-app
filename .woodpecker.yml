pipeline:
  # Run your tests first to make sure code is good
  test:
    image: node:20
    commands:
      - npm install

  # Trigger Dokploy to start its own build
  deploy:
    image: alpine
    commands:
      - curl -X POST "https://dokploy.d.gandhiva.online/api/deploy/zzz3QBei2xW9jVKtqLKMW"
    when:
      branch: main
      event: push
