# .woodpecker.yml
when:
  event: [push, manual] # Runs on every push or when you click "Run pipeline"

steps:
  test-app:
    image: node:20-alpine
    commands:
      - echo "Testing Next.js app..."
      - npm install --dry-run # A quick test to see if dependencies are okay
      - echo "Test successful!"

  trigger-deploy:
    image: curlimages/curl
    commands:
      # Use your actual Dokploy webhook URL here
      - curl -X POST "https://dokploy.d.gandhiva.online/api/deploy/zzz3QBei2xW9jVKtqLKMW"
    when:
      branch: main # Only trigger deployment from the main branch
